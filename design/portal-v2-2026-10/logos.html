<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo 候选</title>
<link rel="stylesheet" href="styles.css">
<style>
.bar2{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar2 .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
.bar2 b{color:var(--fg);margin-right:auto}
.seg{display:inline-flex;background:var(--secondary);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:3px 10px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cand{padding:40px 0;border-bottom:1px solid var(--line)}
.ch{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.ch .k{font:600 12px/1 ui-monospace,Menlo,monospace;color:var(--brand)}
.ch h2{font-size:16px;font-weight:600;color:var(--fg)}
.why{color:var(--muted);font-size:13px;margin:0 0 20px;max-width:760px}
.row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px}
@media (max-width:860px){.row{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.box .cap{font-size:12px;color:var(--faint);padding:8px 12px;border-top:1px solid var(--line)}
/* 顶栏情境 */
.nav-demo{display:flex;align-items:center;height:60px;padding:0 20px;background:var(--bg);gap:40px}
.nav-demo .n{display:flex;gap:22px;font-size:14px;color:var(--muted)}
.nav-demo .n span:first-child{color:var(--fg);font-weight:600}
.dark-demo{background:#141518}
.dark-demo .n{color:#9aa1ad}.dark-demo .n span:first-child{color:#eceef2}
/* 大样 + 图标 */
.big{display:flex;align-items:center;justify-content:center;height:150px;background:var(--bg)}
.icons{display:flex;align-items:flex-end;justify-content:center;gap:22px;height:150px;background:var(--bg)}
.icons figure{margin:0;text-align:center;font-size:11px;color:var(--faint)}
.icons figure>*{display:block;margin:0 auto 6px}
.tab{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:8px 8px 0 0;padding:6px 12px;font-size:12px;color:var(--body)}
/* ---- 标志本体 ---- */
.lk{display:inline-flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none}
.lk.on-dark{color:#eceef2}
.wm{font-family:Inter,sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1}
.wm.caps{letter-spacing:.22em;font-weight:600}
/* 1 akarı + 蓝色光点 */
.w1{position:relative;font-family:Inter,sans-serif;font-weight:650;letter-spacing:-.035em;line-height:1}
.w1 .ii{position:relative}
.w1 .ii b{position:absolute;left:50%;top:-.02em;width:.2em;height:.2em;border-radius:50%;background:var(--brand);transform:translateX(-46%)}
svg.m{display:block;flex:none}
</style>
<script>try{var t=localStorage.getItem('akari-theme');if(t&&t!=='system')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 2 蓝色方标：蓝色圆角方块 + 白色几何 a + 浅色光点 -->
    <symbol id="m2" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="8" fill="var(--brand)"/>
      <circle cx="14.6" cy="18" r="5.4" fill="none" stroke="#fff" stroke-width="2.8"/>
      <path d="M20 12.6V23.4" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="24" cy="8" r="2.4" fill="#fff" opacity=".7"/>
    </symbol>
    <!-- 3 A 光束：线描 A，横杠是一道向右射出的蓝色光束 -->
    <symbol id="m3" viewBox="0 0 32 32">
      <path d="M5 27 14 5h0L23 27" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9.5 19H29" stroke="var(--brand)" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <!-- 4 晨光：地平线上的半圆 + 一圈光晕 -->
    <symbol id="m4" viewBox="0 0 32 32">
      <path d="M7 22a9 9 0 0 1 18 0Z" fill="var(--brand)"/>
      <path d="M2.5 22a13.5 13.5 0 0 1 27 0" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" opacity=".35"/>
      <path d="M2 26.5h28" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <!-- 5 字母 a 圆章：深色圆 + 白色 a 的抽象（圆 + 竖）+ 蓝点 -->
    <symbol id="m5" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="16" fill="currentColor"/>
      <circle cx="14.5" cy="17" r="5.6" fill="none" stroke="var(--bg)" stroke-width="2.8"/>
      <path d="M20.1 11.4V22.6" stroke="var(--bg)" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="23.6" cy="8.6" r="2.6" fill="var(--brand)"/>
    </symbol>
  </defs>
</svg>

<div class="bar2"><div class="wrap">
  <b>Logo 候选（门户 v2 · 配色 A）</b>
  <div class="seg" id="theme"><button data-v="system">跟随系统</button><button data-v="light">浅色</button><button data-v="dark">深色</button></div>
</div></div>
<main class="wrap" id="list"></main>

<template id="t1"><span class="w1" style="font-size:{s}px">akar<span class="ii">ı<b></b></span></span></template>

<script>
const C=[
 {k:'1',n:'光点字标',why:'只用字：小写 akari，字重 650、字距收紧；i 上面的点换成品牌蓝圆点——"akari"（日语"光"）的那一点光。最克制，和排版风最搭；缺点是没有单独图形，网站图标只能用蓝点或字母 a。',
  logo:(s,d)=>`<span class="lk${d?' on-dark':''}">${T1(s)}</span>`,
  icon:(s)=>`<svg class="m" width="${s}" height="${s}" viewBox="0 0 32 32"><rect width="32" height="32" rx="${s<20?6:8}" fill="var(--fg)"/><text x="16" y="23" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="20" fill="var(--bg)">a</text><circle cx="24.5" cy="8" r="3" fill="var(--brand)"/></svg>`},
 {k:'2',n:'蓝色方标',why:'品牌蓝圆角方块里一个几何化的白色小写 a，右上角一颗浅色光点。像 App 图标，在浏览器标签和手机桌面上最醒目；字标用常规 Akari。',
  logo:(s,d)=>`<span class="lk${d?' on-dark':''}"><svg class="m" width="${s*1.25}" height="${s*1.25}"><use href="#m2"/></svg><span class="wm" style="font-size:${s}px">Akari</span></span>`,
  icon:(s)=>`<svg class="m" width="${s}" height="${s}"><use href="#m2"/></svg>`},
 {k:'3',n:'A 光束',why:'线描的 A，横杠是一道向右射出的蓝色光束（呼应原来"灯塔"的意象，但更抽象）。配大写字距拉开的 AKARI，最像"品牌"，也最接近现在的字标。',
  logo:(s,d)=>`<span class="lk${d?' on-dark':''}"><svg class="m" width="${s*1.35}" height="${s*1.35}"><use href="#m3"/></svg><span class="wm caps" style="font-size:${s*.9}px">AKARI</span></span>`,
  icon:(s)=>`<svg class="m" width="${s}" height="${s}" style="color:var(--fg)"><use href="#m3"/></svg>`},
 {k:'4',n:'晨光',why:'地平线上升起的半个太阳和一圈淡光晕——"越过长城，走向世界"那种破晓的感觉。温和、好认，但比 2、3 更偏"图画"。',
  logo:(s,d)=>`<span class="lk${d?' on-dark':''}"><svg class="m" width="${s*1.35}" height="${s*1.35}"><use href="#m4"/></svg><span class="wm" style="font-size:${s}px">Akari</span></span>`,
  icon:(s)=>`<svg class="m" width="${s}" height="${s}" style="color:var(--fg)"><use href="#m4"/></svg>`},
 {k:'5',n:'a 圆章',why:'深色圆章里一个几何化的小写 a，右上角一颗蓝点。像 App 图标，放在顶栏很稳；与 1 是一家人（同一颗蓝点），可以 1 做字标、5 做网站图标。',
  logo:(s,d)=>`<span class="lk${d?' on-dark':''}"><svg class="m" width="${s*1.3}" height="${s*1.3}" style="color:${d?'#eceef2':'var(--fg)'}"><use href="#m5"/></svg><span class="wm" style="font-size:${s}px">Akari</span></span>`,
  icon:(s)=>`<svg class="m" width="${s}" height="${s}" style="color:var(--fg)"><use href="#m5"/></svg>`},
];
const T1=s=>document.getElementById('t1').innerHTML.replace('{s}',s);
const L=document.getElementById('list');
C.forEach(c=>{const sec=document.createElement('section');sec.className='cand';
 sec.innerHTML=`<div class="ch"><span class="k">${c.k}</span><h2>${c.n}</h2></div><p class="why">${c.why}</p>
 <div class="row">
  <div class="box"><div class="nav-demo">${c.logo(20)}<div class="n"><span>仪表盘</span><span>商店</span><span>线路</span><span>用量</span></div></div>
   <div class="nav-demo dark-demo" data-dark>${c.logo(20,true)}<div class="n"><span>仪表盘</span><span>商店</span><span>线路</span></div></div><div class="cap">顶栏（浅 / 深）</div></div>
  <div class="box"><div class="big">${c.logo(38)}</div><div class="cap">大样（登录页）</div></div>
  <div class="box"><div class="icons">
    <figure>${c.icon(64)}64</figure><figure>${c.icon(32)}32</figure><figure>${c.icon(16)}16</figure>
    <figure><span class="tab">${c.icon(16)}仪表盘 · Akari</span>标签页</figure></div><div class="cap">网站图标</div></div>
 </div>`;L.appendChild(sec)});
/* 深色演示条里的符号要用深色主题的变量 */
document.querySelectorAll('[data-dark]').forEach(e=>{e.style.setProperty('--fg','#eceef2');e.style.setProperty('--bg','#141518');e.style.setProperty('--brand','#4a9dff')});
const th=document.getElementById('theme');function mark(){const t=document.documentElement.dataset.theme||'system';th.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===t))}mark();
th.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;try{localStorage.setItem('akari-theme',v)}catch(e){}mark()});
</script>
</body>
</html>
