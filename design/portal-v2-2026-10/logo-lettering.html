<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定制字标</title>
<link rel="stylesheet" href="styles.css">
<style>
.bar2{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar2 .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
.bar2 b{color:var(--fg);margin-right:auto}
.seg{display:inline-flex;background:var(--secondary);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:3px 10px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cand{padding:34px 0;border-bottom:1px solid var(--line)}
.ch{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.ch .k{font:600 12px/1 ui-monospace,Menlo,monospace;color:var(--brand)}
.ch h2{font-size:16px;font-weight:600;color:var(--fg)}
.why{color:var(--muted);font-size:13px;margin:0 0 18px;max-width:780px}
.row{display:grid;grid-template-columns:1.2fr 1fr .55fr;gap:16px}
@media (max-width:900px){.row{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.box .cap{font-size:12px;color:var(--faint);padding:8px 12px;border-top:1px solid var(--line)}
.nav-demo{display:flex;align-items:center;height:60px;padding:0 20px;background:var(--bg);gap:44px;color:var(--fg)}
.nav-demo .n{display:flex;gap:22px;font-size:14px;color:var(--muted)}
.nav-demo .n span:first-child{color:var(--fg);font-weight:600}
.dk{background:#141518;--fg:#eceef2;--brand:#4a9dff;--bg:#141518;color:#eceef2}
.dk .n{color:#9aa1ad}
.big{display:flex;align-items:center;justify-content:center;height:140px;background:var(--bg);color:var(--fg)}
.ico{display:flex;align-items:center;justify-content:center;gap:16px;height:140px;background:var(--bg)}
svg.wm{display:block;overflow:visible}
</style>
<script>try{var t=localStorage.getItem('akari-theme');if(t&&t!=='system')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="bar2"><div class="wrap">
  <b>定制字标 · 手工字形（不依赖任何字体，可直接转成 PNG / SVG）</b>
  <div class="seg" id="theme"><button data-v="system">跟随系统</button><button data-v="light">浅色</button><button data-v="dark">深色</button></div>
</div></div>
<main class="wrap" id="list"></main>
<script>
/* 字形坐标：大写字高 100；x 方向按字宽排布 */
const B='var(--brand)',F='currentColor';
function word(glyphs,gap){let x=0,out='',maxR=0;glyphs.forEach(g=>{out+=`<g transform="translate(${x},0)">${g.d}</g>`;x+=g.w+gap;});return{svg:out,w:x-gap}}
function S(d,sw,cap,join,col){return `<path d="${d}" fill="none" stroke="${col||F}" stroke-width="${sw}" stroke-linecap="${cap}" stroke-linejoin="${join}"/>`}

/* L1 灯芯：等线几何大写；A 没有横杠，里面一颗蓝色"灯芯"；K 的臂与腿分离 */
function L1(){const w=17,c='round',j='round';return word([
 {w:80,d:S('M0,100 L40,0 L80,100',w,c,j)+`<circle cx="40" cy="70" r="8.5" fill="${B}"/>`},
 {w:62,d:S('M0,0 V100',w,c,j)+S('M62,0 L18,52',w,c,j)+S('M33,52 L62,100',w,c,j)},
 {w:80,d:S('M0,100 L40,0 L80,100',w,c,j)+`<circle cx="40" cy="70" r="8.5" fill="${B}"/>`},
 {w:62,d:S('M0,100 V0 H32 A26,26 0 0 1 32,52 H0',w,c,j)+S('M30,52 L62,100',w,c,j)},
 {w:0,d:S('M0,0 V100',w,c,j)},
],30)}

/* L2 切角：方头、直角切口的"工程"字形；A 的横杠是一道蓝色光束，向右伸出 */
function L2(){const w=18,c='butt',j='miter';return word([
 {w:78,d:S('M0,100 L39,0 L78,100',w,c,j)+`<rect x="15" y="62" width="60" height="12" fill="${B}"/>`},
 {w:60,d:S('M9,0 V100',w,c,j)+S('M60,0 L22,46',w,c,j)+S('M30,52 L62,100',w,c,j)},
 {w:78,d:S('M0,100 L39,0 L78,100',w,c,j)+`<rect x="15" y="62" width="60" height="12" fill="${B}"/>`},
 {w:62,d:S('M9,100 V9 H36 L54,27 V34 L36,52 H9',w,c,j)+S('M34,52 L62,100',w,c,j)},
 {w:18,d:S('M9,0 V100',w,c,j)},
],24)}

/* L3 光轨：圆润小写，字母底部被一条细光轨串起来，尽头是 i 的蓝点抬升成"光" */
function L3(){const w=15,c='round',j='round';return word([
 {w:58,d:S('M52,40 V100',w,c,j)+`<circle cx="26" cy="70" r="26" fill="none" stroke="${F}" stroke-width="${w}"/>`},
 {w:50,d:S('M0,0 V100',w,c,j)+S('M48,40 L12,74',w,c,j)+S('M24,64 L50,100',w,c,j)},
 {w:58,d:S('M52,40 V100',w,c,j)+`<circle cx="26" cy="70" r="26" fill="none" stroke="${F}" stroke-width="${w}"/>`},
 {w:36,d:S('M0,100 V68 A28,28 0 0 1 36,42',w,c,j)},
 {w:0,d:S('M0,46 V100',w,c,j)+`<circle cx="0" cy="18" r="9" fill="${B}"/>`},
],22)}

/* L4 刻刀：粗细对比的锐利大写；粗竖 + 细斜线，A 顶是尖的，I 顶一道蓝色斜切 */
function L4(){return word([
 {w:84,d:`<path d="M0,100 L36,0 H48 L84,100 H66 L42,30 L18,100Z" fill="${F}"/><path d="M27,74 H57" stroke="${B}" stroke-width="7"/>`},
 {w:64,d:`<path d="M0,0 H17 V100 H0Z" fill="${F}"/><path d="M17,58 L58,0 H66 L26,56 L66,100 H48 L17,64Z" fill="${F}"/>`},
 {w:84,d:`<path d="M0,100 L36,0 H48 L84,100 H66 L42,30 L18,100Z" fill="${F}"/><path d="M27,74 H57" stroke="${B}" stroke-width="7"/>`},
 {w:66,d:`<path d="M0,0 H34 A27,27 0 0 1 34,54 H17 V100 H0Z M17,15 V39 H33 A12,12 0 0 0 33,15Z" fill="${F}" fill-rule="evenodd"/><path d="M30,54 H47 L66,100 H48Z" fill="${F}"/>`},
 {w:17,d:`<path d="M0,22 L17,10 V100 H0Z" fill="${F}"/><path d="M0,14 L17,2 V-8 L0,4Z" fill="${B}"/>`},
],22)}

const V=[
 {k:'L1',n:'灯芯 · 等线几何',why:'等粗圆头笔画，A 去掉横杠，中间一颗蓝色"灯芯"——两个 A 就是两盏灯（呼应原来的"灯塔"）。K 的臂和腿断开留白。干净、现代、有记忆点。',f:L1,ic:'A'},
 {w:1,k:'L2',n:'切角 · 工程感',why:'方头直角的笔画，R 的弯用 45° 切角代替圆弧，A 的横杠是一道蓝色光束向右伸出 A 外。像仪器面板上的字，科技感最强。',f:L2,ic:'A2'},
 {k:'L3',n:'光轨 · 圆润小写',why:'几何圆形的小写 a，等线圆头；i 的点是蓝色"光源"，比字母更高一截。最亲和、最有个性，适合想要柔和品牌的站点。',f:L3,ic:'a'},
 {k:'L4',n:'刻刀 · 粗细对比',why:'粗竖细斜的锐利大写，A 顶是尖的；A 的横杠是蓝线，I 顶上一道蓝色斜切像一束光。最"有劲"、最像品牌字，但小尺寸下细节会少一些。',f:L4,ic:'A4'},
];
function render(f,h,extra){const r=f();const pad=10;return `<svg class="wm" height="${h}" viewBox="${-pad} ${-pad-12} ${r.w+pad*2} ${124+pad*2}" ${extra||''}>${r.svg}</svg>`}
/* 网站图标：取字标里的第一个字母 */
function icon(v,s,dark){const g=v.f;const tmp=g();const first=tmp.svg.split('</g>')[0]+'</g>';
 return `<svg width="${s}" height="${s}" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="${dark?'#eceef2':'#12151c'}"/><g transform="translate(${v.k==='L3'?36:22},${v.k==='L3'?14:22}) scale(.84)" style="color:${dark?'#12151c':'#fff'}">${first.replace('<g transform="translate(0,0)">','<g>')}</g></svg>`}
const L=document.getElementById('list');
V.forEach(v=>{const e=document.createElement('section');e.className='cand';
 e.innerHTML=`<div class="ch"><span class="k">${v.k}</span><h2>${v.n}</h2></div><p class="why">${v.why}</p>
 <div class="row"><div class="box"><div class="nav-demo">${render(v.f,26)}<div class="n"><span>仪表盘</span><span>商店</span><span>线路</span><span>用量</span></div></div>
 <div class="nav-demo dk">${render(v.f,26)}<div class="n"><span>仪表盘</span><span>商店</span><span>线路</span></div></div><div class="cap">顶栏（浅 / 深）</div></div>
 <div class="box"><div class="big">${render(v.f,56)}</div><div class="cap">大样（登录页）</div></div>
 <div class="box"><div class="ico">${icon(v,64)}${icon(v,32)}${icon(v,16)}</div><div class="cap">网站图标</div></div></div>`;L.appendChild(e)});
const th=document.getElementById('theme');function mark(){const t=document.documentElement.dataset.theme||'system';th.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===t))}mark();
th.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;try{localStorage.setItem('akari-theme',v)}catch(e){}mark()});
</script>
</body>
</html>
