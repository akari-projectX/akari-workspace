<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光点字标 · 大小写</title>
<link rel="stylesheet" href="styles.css">
<style>
.bar2{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar2 .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
.bar2 b{color:var(--fg);margin-right:auto}
.seg{display:inline-flex;background:var(--secondary);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:3px 10px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cand{padding:34px 0;border-bottom:1px solid var(--line)}
.ch{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.ch .k{font:600 12px/1 ui-monospace,Menlo,monospace;color:var(--brand)}
.ch h2{font-size:16px;font-weight:600;color:var(--fg)}
.why{color:var(--muted);font-size:13px;margin:0 0 18px;max-width:760px}
.row{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media (max-width:860px){.row{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.box .cap{font-size:12px;color:var(--faint);padding:8px 12px;border-top:1px solid var(--line)}
.nav-demo{display:flex;align-items:center;height:60px;padding:0 20px;background:var(--bg);gap:44px}
.nav-demo .n{display:flex;gap:22px;font-size:14px;color:var(--muted)}
.nav-demo .n span:first-child{color:var(--fg);font-weight:600}
.dk{background:#141518;--fg:#eceef2;--brand:#4a9dff}
.dk .n{color:#9aa1ad}
.big{display:flex;align-items:center;justify-content:center;height:128px;background:var(--bg)}
/* 字标 */
.wm{display:inline-flex;align-items:flex-end;color:var(--fg);font-family:Inter,sans-serif;line-height:1;white-space:nowrap}
.lo{font-weight:650;letter-spacing:-.035em}
.up{font-weight:650;letter-spacing:.06em}
.up.wide{letter-spacing:.2em;font-weight:600}
.tc{font-weight:650;letter-spacing:-.025em}
.dot{position:relative;display:inline-block}
.dot b{position:absolute;left:50%;width:.2em;height:.2em;border-radius:50%;background:var(--brand);transform:translateX(-50%)}
.lo .dot b,.tc .dot b{top:-.02em}
.up .dot{letter-spacing:0}
.up .dot b{top:-.34em;width:.21em;height:.21em}
.blue{color:var(--brand)}
.per{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--brand);margin-left:.06em;margin-bottom:.02em}
.beam{display:inline-block;width:.16em;height:.72em;background:var(--brand);border-radius:.02em;margin:0 .03em}
</style>
<script>try{var t=localStorage.getItem('akari-theme');if(t&&t!=='system')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="bar2"><div class="wrap">
  <b>光点字标 · 小写 vs 大写</b>
  <div class="seg" id="theme"><button data-v="system">跟随系统</button><button data-v="light">浅色</button><button data-v="dark">深色</button></div>
</div></div>
<main class="wrap" id="list"></main>
<script>
const V=[
 {k:'1a',n:'小写 akari（上一版）',why:'i 的点换成蓝点，最自然——小写本来就有那个点。显得亲和、现代。',
  h:s=>`<span class="wm lo" style="font-size:${s}px">akar<span class="dot">ı<b></b></span></span>`},
 {k:'1b',n:'大写 AKARI · I 上加蓝点',why:'大写更稳、更像品牌；I 本来没有点，加一颗悬在上方的蓝点，"光"的意思还在。字距略放开。',
  h:s=>`<span class="wm up" style="font-size:${s}px">AKAR<span class="dot">I<b></b></span></span>`},
 {k:'1c',n:'大写 AKARI · 句点蓝点',why:'大写 + 结尾一颗蓝色句点，像"一句话说完"的笃定感，也是那一点光。和现在门户的"AKARI"最接近，只多一颗点。',
  h:s=>`<span class="wm up" style="font-size:${s}px">AKARI<span class="per"></span></span>`},
 {k:'1d',n:'大写宽字距 AKARI · 蓝色 I',why:'字距拉开，最后的 I 用品牌蓝——像一束竖直的光。最"高级感"，但小尺寸下蓝色 I 不太明显。',
  h:s=>`<span class="wm up wide" style="font-size:${s*.92}px">AKAR<span class="blue">I</span></span>`},
 {k:'1e',n:'首字母大写 Akari',why:'折中：A 大写、其余小写，i 上是蓝点。比全小写正式，比全大写柔和。',
  h:s=>`<span class="wm tc" style="font-size:${s}px">Akar<span class="dot">ı<b></b></span></span>`},
];
const L=document.getElementById('list');
V.forEach(v=>{const e=document.createElement('section');e.className='cand';
 e.innerHTML=`<div class="ch"><span class="k">${v.k}</span><h2>${v.n}</h2></div><p class="why">${v.why}</p>
 <div class="row"><div class="box"><div class="nav-demo">${v.h(21)}<div class="n"><span>仪表盘</span><span>商店</span><span>线路</span><span>用量</span></div></div>
 <div class="nav-demo dk">${v.h(21)}<div class="n"><span>仪表盘</span><span>商店</span><span>线路</span></div></div><div class="cap">顶栏（浅 / 深）</div></div>
 <div class="box"><div class="big">${v.h(44)}</div><div class="cap">大样（登录页）</div></div></div>`;L.appendChild(e)});
const th=document.getElementById('theme');function mark(){const t=document.documentElement.dataset.theme||'system';th.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===t))}mark();
th.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;try{localStorage.setItem('akari-theme',v)}catch(e){}mark()});
</script>
</body>
</html>
