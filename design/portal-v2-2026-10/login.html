<div class="auth-top">
  <button class="iconbtn" data-theme-btn aria-label="切换主题"><svg class="i"><use href="#i-monitor"/></svg></button>
  <button class="iconbtn" aria-label="Switch to English">EN</button>
</div>
<main class="auth-main">
  <div class="auth-col">
    <h1><span class="logo">AKARI</span><span class="sr">Akari 账户</span></h1>

    <div class="tabs" role="tablist">
      <button role="tab" data-tab="login" aria-selected="true">登录</button>
      <button role="tab" data-tab="register" aria-selected="false">注册</button>
    </div>

    <form onsubmit="return false">
      <div class="field">
        <label for="email">邮箱</label>
        <input class="input" id="email" type="email" autocomplete="email" placeholder="name@example.com">
      </div>
      <div class="field only-register">
        <label for="code">邮箱验证码</label>
        <div class="inline"><input class="input num" id="code" inputmode="numeric" placeholder="6 位数字"><button class="btn" type="button">发送验证码</button></div>
      </div>
      <div class="field">
        <label for="pw">密码<a class="only-login" href="#">忘记密码？</a><em class="only-register">至少 8 位</em></label>
        <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="输入密码">
      </div>
      <div class="field only-register">
        <label for="inv">邀请码<em>选填</em></label>
        <input class="input" id="inv" placeholder="没有可以留空">
      </div>

      <div class="ts" aria-label="人机验证（Cloudflare Turnstile 占位）">
        <span class="cb"></span>确认您是真人
        <span class="brand">Cloudflare<br>Turnstile</span>
      </div>

      <button class="btn pri block only-login" type="submit">登录</button>
      <button class="btn pri block only-register" type="submit">注册</button>
    </form>

    <div class="only-login">
      <div class="or">或</div>
      <button class="btn block"><svg class="i"><use href="#i-key"/></svg>使用通行密钥登录</button>
    </div>
    <p class="fine only-register">注册即表示同意 <a href="#">服务条款</a> 与 <a href="#">隐私政策</a></p>
  </div>
</main>
<footer><div class="wrap"><span>© 2026 Akari</span><a href="#">服务条款</a><a href="#">隐私政策</a></div></footer>
<script src="app.js"></script>
</body>
</html>
